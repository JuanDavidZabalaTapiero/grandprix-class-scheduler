{% extends "base.html" %}

{% block title %}Error de seguridad{% endblock %}

{% block main %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="text-center">
        <h1 class="display-4 fw-bold text-warning">Error de seguridad</h1>
        <p class="text-muted mb-2">
            La sesión ha expirado o la solicitud no es válida.
        </p>

            Actualiza la página e intenta nuevamente.
        </p>
        <a href="{{ url_for('students.home') }}" class="btn btn-primary">
            Volver al inicio
        </a>
    </div>
</div>
{% endblock %}
