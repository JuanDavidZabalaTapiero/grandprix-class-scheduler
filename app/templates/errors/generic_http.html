{% extends "base.html" %}

{% block title %}{{ code }}{% endblock %}

{% block main %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="text-center">
        <h1 class="display-1 fw-bold text-secondary">{{ code }}</h1>
        <h2 class="mb-3">Ha ocurrido un error</h2>
        <p class="text-muted mb-4">
            Ha ocurrido un error al procesar tu solicitud. Intenta nuevamente o contacta con soporte si el problema persiste.
        </p>
        <a href="{{ url_for('students.home') }}" class="btn btn-primary">
            Volver al inicio
        </a>
    </div>
</div>
{% endblock %}
