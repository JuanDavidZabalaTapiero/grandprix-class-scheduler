{% extends "base.html" %}

{% block title %}Alumnos{% endblock %}

{% block main %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Alumnos</h1>

        <a href="{{ url_for('students.register_student_form') }}"
            class="btn btn-primary d-inline-flex align-items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-lg"
                viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2" />
            </svg>
            Registrar
        </a>
    </div>

    <!-- FORM: BUSCAR ALUMNOS -->
    <form id="studentSearchForm" class="mb-4">
        <div class="input-group">
            <input type="text" id="studentSearchInput" class="form-control" placeholder="Buscar alumno por nombre..."
                autocomplete="off">
            <button class="btn btn-dark px-4 d-inline-flex align-items-center gap-2" type="submit">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search"
                    viewBox="0 0 16 16">
                    <path
                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                </svg>
                Buscar
            </button>
        </div>
    </form>

    <!-- RESULTADOS -->
    <div id="studentSearchResults" class="mt-3"
        data-edit-url-base="{{ url_for('students.edit_student_form', student_id=0) }}"
        data-delete-url-base="{{url_for('students.delete_student', student_id=0)}}">
    </div>

    <!-- TEMPLATE: ITEM ALUMNO -->
    <template id="student-item-template">
        <div class="d-flex align-items-center justify-content-between px-3 py-2 border rounded-3 bg-white mb-2">

            <!-- INFO -->
            <div class="d-flex align-items-center gap-3">
                <span class="student-name fw-semibold"></span>
                <span class="student-document text-secondary small"></span>
            </div>

            <!-- ACTIONS -->
            <div class="d-flex align-items-center gap-2">

                <a class="btn btn-sm btn-light border
                      d-inline-flex align-items-center justify-content-center gap-1
                      student-edit-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-pen"
                        viewBox="0 0 16 16">
                        <path
                            d="m13.498.795.149-.149a1.207 1.207 0 1 1 1.707 1.708l-.149.148a1.5 1.5 0 0 1-.059 2.059L4.854 14.854a.5.5 0 0 1-.233.131l-4 1a.5.5 0 0 1-.606-.606l1-4a.5.5 0 0 1 .131-.232l9.642-9.642a.5.5 0 0 0-.642.056L6.854 4.854a.5.5 0 1 1-.708-.708L9.44.854A1.5 1.5 0 0 1 11.5.796a1.5 1.5 0 0 1 1.998-.001m-.644.766a.5.5 0 0 0-.707 0L1.95 11.756l-.764 3.057 3.057-.764L14.44 3.854a.5.5 0 0 0 0-.708z" />
                    </svg>
                    Editar
                </a>

                <form method="post" class="m-0 student-delete-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <button type="submit" class="btn btn-sm btn-outline-danger
                               d-inline-flex align-items-center justify-content-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                            class="bi bi-trash3-fill" viewBox="0 0 16 16">
                            <path
                                d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5" />
                        </svg>
                        Eliminar
                    </button>
                </form>

            </div>
        </div>
    </template>

</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import { initStudentSearch } from "{{url_for('static', filename='js/features/studentSearch.js')}}";

    initStudentSearch({
        formId: "studentSearchForm",
        inputId: "studentSearchInput",
        resultsId: "studentSearchResults"
    });
</script>
{% endblock %}
