{% extends "base.html" %}

<!-- IMPORTS -->
{% from "macros/buttons.html" import edit_button, delete_button %}

{% block title %}Alumnos{% endblock %}

{% block main %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Alumnos</h1>

        <a href="{{ url_for('students.register_form') }}"
            class="btn btn-primary d-inline-flex align-items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-plus-lg"
                viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M8 2a.5.5 0 0 1 .5.5v5h5a.5.5 0 0 1 0 1h-5v5a.5.5 0 0 1-1 0v-5h-5a.5.5 0 0 1 0-1h5v-5A.5.5 0 0 1 8 2" />
            </svg>
            Registrar
        </a>
    </div>

    <div class="action-bar d-flex flex-wrap gap-2 mb-4">
        <a href="{{url_for('enrollments.register_form')}}"
            class="btn btn-outline-success d-inline-flex align-items-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                class="bi bi-journal-plus" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M8 5.5a.5.5 0 0 1 .5.5v1.5H10a.5.5 0 0 1 0 1H8.5V10a.5.5 0 0 1-1 0V8.5H6a.5.5 0 0 1 0-1h1.5V6a.5.5 0 0 1 .5-.5" />
                <path
                    d="M3 0h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2v-1h1v1a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1v1H1V2a2 2 0 0 1 2-2" />
                <path
                    d="M1 5v-.5a.5.5 0 0 1 1 0V5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0V8h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1zm0 3v-.5a.5.5 0 0 1 1 0v.5h.5a.5.5 0 0 1 0 1h-2a.5.5 0 0 1 0-1z" />
            </svg>
            Matricular
        </a>
    </div>

    <!-- FORM: BUSCAR ALUMNOS -->
    <form id="studentSearchForm" class="mb-4">
        <div class="input-group">
            <input type="text" id="studentSearchInput" class="form-control"
                placeholder="Buscar alumno por nombre o ID..." autocomplete="off">
            <button class="btn btn-dark px-4 d-inline-flex align-items-center gap-2" type="submit">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search"
                    viewBox="0 0 16 16">
                    <path
                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                </svg>
                Buscar
            </button>
        </div>
    </form>

    <!-- RESULTADOS -->
    <div id="studentSearchResults" class="mt-3" data-edit-url-base="{{ url_for('students.edit_form', student_id=0) }}"
        data-delete-url-base="{{url_for('students.delete', student_id=0)}}" data-enrollment-url-base="{{url_for('enrollments.home', enrollment_id=0)}}">
    </div>

    <!-- TEMPLATE: ITEM ALUMNO -->
    <template id="student-item-template">
        <div class="border rounded-3 bg-white p-3 mb-2">

            <!-- HEADER -->
            <div class="d-flex align-items-center justify-content-between mb-2">

                <!-- INFO -->
                <div class="d-flex align-items-center gap-3">
                    <span class="student-name fw-semibold"></span>
                    <span class="student-document text-secondary small"></span>
                </div>

                <!-- ACTIONS -->
                <div class="d-flex align-items-center gap-2">
                    {{edit_button(link_class="student-edit-btn")}}
                    {{delete_button(form_class="student-delete-form") }}
                </div>
            </div>

            <!-- ENROLLMENTS -->
            <div class="student-enrollments d-grid gap-2"></div>

        </div>
    </template>

</div>
{% endblock %}

{% block scripts %}
<script type="module">
    import { initStudentSearch } from "{{url_for('static', filename='js/features/studentSearch.js')}}";

    initStudentSearch({
        formId: "studentSearchForm",
        inputId: "studentSearchInput",
        resultsId: "studentSearchResults"
    });
</script>
{% endblock %}
