{% extends "base.html" %} {% block title %}Lista de cronogramas{% endblock %} {%
block main %}
<div class="container">
  <div class="d-flex justify-content-between">
    <h1 class="mb-4 text-center">Cronograma del día</h1>

    <form
      method="post"
      class="row g-3 justify-content-center align-items-end mb-4"
    >
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="col-auto">
        <input
          type="date"
          id="date-input"
          name="date-input"
          value="{{date}}"
          class="form-control"
        />
      </div>

      <div class="col-auto">
        <button type="submit" class="btn btn-primary">Actualizar</button>
      </div>
    </form>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Instructor</th>
          <th>Cronograma</th>
        </tr>
      </thead>

      <tbody>
        {% for instructor in instructors %}
        <tr>
          <td>{{instructor.name}}</td>
          <td>
            <a
              href="{{url_for('instructors.schedule', instructor_id=instructor.id, date=date)}}"
              class="btn btn-outline-primary d-inline-flex align-items-center gap-2"
            >
              <!-- ICON -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                fill="currentColor"
                class="bi bi-eye"
                viewBox="0 0 16 16"
              >
                <path
                  d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"
                />
                <path
                  d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"
                />
              </svg>
              Ver
            </a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
